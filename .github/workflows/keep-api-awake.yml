name: Keep the API awake

# Render's free tier spins the API down after 15 minutes of inactivity, and a
# cold wake takes 30–50 seconds. Because Next renders Home on the server and
# blocks on the API, that lands squarely on whoever opens the app first — most
# often the person we asked to come and look at it.
#
# So we keep it warm during the hours anyone actually opens it.
#
# Not around the clock, on purpose: the free plan allows 750 instance-hours a
# month, and a 24/7 ping would burn ~730 of them, leaving no room for deploys or
# restarts — and going over suspends the service. The window below keeps it awake
# ~14 hours a day (~430 hours a month), which is comfortably inside the budget.
# Outside the window it is allowed to sleep, and the first visitor pays the 30–50
# seconds. That is the trade the free tier offers; this takes the good half of it.

on:
  schedule:
    # Every 5 minutes, 04:00–17:59 UTC ≈ 07:00–21:00 Israel time, every day.
    #
    # Five, not ten, because GitHub's scheduler is not punctual — a run can be
    # held for 10 minutes or more under load. At a 10-minute cadence one such
    # delay opens a >15-minute gap and the service is asleep again, which is the
    # one outcome this file exists to prevent.
    - cron: "*/5 4-17 * * *"
  # Also runnable by hand — useful to warm the API before a demo outside the
  # window, and to switch the schedule back on: GitHub disables cron in repos
  # with no activity for 60 days, and a manual run counts as activity.
  workflow_dispatch:

permissions:
  # Default is read-only; the alerting steps below need to open/close an
  # issue when the ping fails or recovers.
  contents: read
  issues: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health check
        id: ping
        # continue-on-error, not a bare failure: we still want the alerting
        # steps below to run when this fails, and we fail the job explicitly
        # at the end so the run still goes red (see "Fail the job" below).
        continue-on-error: true
        # /api/health also queries the database, so this keeps Neon warm too.
        #
        # --max-time 90: if the service *was* asleep this request is the one that
        # wakes it, and waking is exactly the slow case. A short timeout would
        # give up precisely when the ping is doing its job.
        #
        # -f: a non-2xx turns the run red, so this doubles as an uptime check.
        run: |
          curl -fsS \
            --max-time 90 \
            --retry 3 --retry-delay 20 --retry-all-errors \
            https://shikun-api.onrender.com/api/health

      # A run that never gets a single byte back across 4 attempts (the
      # request plus 3 retries, ~90s each) isn't a slow cold wake — a cold
      # wake answers well inside the timeout. It means the service is down,
      # suspended (e.g. free-tier instance-hours exceeded), or otherwise
      # unreachable, and nothing here retries across runs. Open an issue so
      # that's visible without someone noticing the app is slow/broken and
      # asking first.
      - name: Open an issue if the API is unreachable
        if: steps.ping.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'api-down';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            if (open.length > 0) return; // already tracked, don't spam
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'API unreachable — keep-api-awake ping failing',
              labels: [label],
              body: [
                'The scheduled health-check ping timed out with 0 bytes received.',
                '',
                `Failing run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'This is not the expected cold-wake case (that responds within the',
                "timeout). Check Render's dashboard for a suspended service (free-tier",
                'instance-hours exceeded) or a platform outage.',
                '',
                'This issue closes automatically once a ping succeeds again.',
              ].join('\n'),
            });

      # Mirror image of the step above: close out the alert once the API is
      # reachable again, so the issue tracker reflects current state.
      - name: Close the alert if the API has recovered
        if: steps.ping.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'api-down';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recovered — ping succeeded again: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }

      # Preserve the original behavior: a failed ping still turns the run
      # red (the uptime check the top-level comment already relies on).
      - name: Fail the job if the ping failed
        if: steps.ping.outcome == 'failure'
        run: exit 1
